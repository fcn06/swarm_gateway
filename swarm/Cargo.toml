[workspace]
resolver = "3"

members = [ 
    "swarm_server",
]

[workspace.dependencies]
swarm_server = { path = "./swarm_server" }

agent_core = { path = "../swarm_commons/agent_core" }
configuration = { path = "../swarm_commons/configuration" }
llm_api = { path = "../swarm_commons/llm_api" }
agent_models = { path = "../swarm_commons/agent_models" }

agent_memory_service = { path = "../swarm_services/agent_memory_service" }

rmcp = { version = "1.3", features = ["client", "client-side-sse", "transport-child-process", "reqwest", "transport-streamable-http-client-reqwest", "auth", "server-side-http", "transport-streamable-http-server"] }
a2a-rs = { version = "0.2", features = ["http-server", "http-client"] }

reqwest = { version = "0.13", features = ["json", "rustls"] }
rustls = "0.23"

tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = { version = "0.1" }

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"

thiserror = "2"
clap = { version = "4.5", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

axum = "0.8"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

oauth2 = "5"
openidconnect = "4"

chrono = { version = "0.4.24", features = ["serde"] }
rand = "0.9"
lazy_static = "1.4"
regex = "1.10"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"
base64 = "0.22"
url = { version = "2.4", features = ["serde"] }

bon = "3"
schemars = { version = "1.0", features = ["chrono04"] }

redb = "3.1"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
