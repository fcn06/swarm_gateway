[workspace]
resolver = "3"

members = [ 
    "agent_memory_service",
]

[workspace.dependencies]
agent_models = { path = "../swarm_commons/agent_models" }
agent_core = { path = "../swarm_commons/agent_core" }
configuration = { path = "../swarm_commons/configuration" }
llm_api = { path = "../swarm_commons/llm_api" }

rmcp = "1.3"
a2a-rs = "0.2"

agent_memory_service = { path = "./agent_memory_service" }

reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rustls = "0.23"

tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = { version = "0.1" }

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"

thiserror = "2"
clap = { version = "4.5", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

axum = "0.8"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

chrono = { version = "0.4.24", features = ["serde"] }
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"

redb = "3.1"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
